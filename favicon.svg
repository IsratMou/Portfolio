<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Tangerine jelly gradient, matching the portfolio's primary accent -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFDCA8" />
      <stop offset="55%" stop-color="#FF9D4D" />
      <stop offset="100%" stop-color="#E35D12" />
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded square plate (jelly-on-a-plate aesthetic) -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#sheen)" />

  <!-- IM monogram -->
  <text
    x="32" y="32"
    font-family="Fredoka, 'Segoe UI', system-ui, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#FFFBF3"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-1"
  >IM</text>
</svg>
